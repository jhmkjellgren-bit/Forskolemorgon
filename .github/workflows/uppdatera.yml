name: Uppdatera morgonskärmen

on:
  schedule:
    - cron: "40 3 * * 1-5"   # vardagar ca 04:40 (vinter) / 05:40 (sommar)
    - cron: "10 17 * * 0-4"  # sön–tor kväll ca 18:10 / 19:10, visar morgondagen
  workflow_dispatch:          # knappen "Run workflow" för att köra direkt

permissions:
  contents: write

concurrency:
  group: uppdatera
  cancel-in-progress: false

jobs:
  uppdatera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography==43.0.3
      - name: Hämta och kryptera dagens data
        env:
          GMAIL_ADRESS: ${{ secrets.GMAIL_ADRESS }}
          GMAIL_APPLOSENORD: ${{ secrets.GMAIL_APPLOSENORD }}
          SIDANS_LOSENORD: ${{ secrets.SIDANS_LOSENORD }}
          BARN: ${{ secrets.BARN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SKOLMATEN_TOKEN: ${{ secrets.SKOLMATEN_TOKEN }}
          SKOLMATEN_SKOLA: ${{ secrets.SKOLMATEN_SKOLA }}
        run: python script/uppdatera.py
      - name: Spara
        run: |
          git config user.name "morgonskarm"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          git commit -m "Uppdatera morgonskärmen" || echo "Inget nytt"
          git push
