<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Förskolemorgon">
<meta name="theme-color" content="#F2BE22">
<title>Förskolemorgon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --fg:#1C2730; --muted:#5B6A76; --line:#D5DCE2;
  --accent:#F2BE22; --accent-ink:#3A2C00; --rain:#2F6FA8; --rain-soft:#D6E5F2; --warn:#B3261E;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#11171C; --surface:#1A232A; --fg:#E6ECF0; --muted:#97A6B2; --line:#2C3943;
  --accent:#F2BE22; --accent-ink:#2A2000; --rain:#7DB3E3; --rain-soft:#1F3446; --warn:#F2B8B5; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.1}
h2{font-size:17px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sub{color:var(--muted);font-size:14px;margin:0}
.brief{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.brief p{margin:0;font-size:16px;font-weight:500}
.brief strong{font-family:var(--display);font-size:20px;line-height:1.2}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.src{font-size:12px;color:var(--muted)}
.windows{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.win{border-radius:10px;background:var(--bg);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.win .lbl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.win .t{font-family:var(--display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.win .d{font-size:13px;color:var(--muted)}
.win.wet{background:var(--rain-soft)}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:320px;height:auto}
ul.pack{list-style:none;margin:0;padding:0}
.pack li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.pack li:first-child{border-top:0}
.pack .why{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
.chk{width:20px;height:20px;accent-color:var(--rain);flex:none}
.pack li.done .n{text-decoration:line-through;color:var(--muted)}
.msgs{display:flex;flex-direction:column;gap:12px}
.msg{border-left:3px solid var(--line);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:2px}
.msg.gor{border-left-color:var(--rain)}
.msg .meta{font-size:12px;color:var(--muted)}
.msg b{font-weight:600}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:1px 7px;margin-right:6px;background:var(--rain-soft);color:var(--rain)}
.empty,.note{color:var(--muted);font-size:14px;margin:0}
.err{color:var(--warn);font-size:13px;margin:0}
a{color:var(--rain)}
.lock{max-width:360px;margin:12vh auto 0;display:flex;flex-direction:column;gap:12px}
.lock input{font:inherit;font-size:17px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.lock button{font:inherit;font-weight:600;font-size:16px;padding:12px;border-radius:10px;border:0;background:var(--fg);color:var(--bg);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>

<form class="lock" id="lock" hidden>
  <h1>Förskolemorgon</h1>
  <p class="sub">Skriv lösenordet för att låsa upp. Det sparas på den här telefonen.</p>
  <input type="password" id="pw" autocomplete="current-password" aria-label="Lösenord" required>
  <button type="submit">Lås upp</button>
  <p class="err" id="lockErr" hidden>Fel lösenord. Försök igen.</p>
</form>

<div class="wrap" id="app" hidden>
  <header style="display:flex;flex-direction:column;gap:4px">
    <span class="eyebrow" id="datum"></span>
    <h1>Förskolemorgon</h1>
    <p class="sub" id="barn"></p>
  </header>

  <div class="brief" aria-live="polite"><strong id="briefHead"></strong><p id="briefText"></p></div>

  <section class="card" id="unikumCard">
    <div class="head"><h2>Från Unikum</h2><span class="src">senaste veckan</span></div>
    <div class="msgs" id="unikum"></div>
  </section>

  <section class="card">
    <div class="head"><h2>Väder vid förskolan</h2><span class="src" id="vsrc">SMHI</span></div>
    <div class="windows" id="windows"></div>
    <div class="chart" id="chart"></div>
  </section>

  <section class="card">
    <div class="head"><h2>Ta på / packa</h2><span class="src" id="antal"></span></div>
    <ul class="pack" id="pack"></ul>
    <p class="note"><a id="editLink" href="#" target="_blank" rel="noopener">Ändra klädlistan</a> (öppnar GitHub)</p>
  </section>

  <section class="card">
    <div class="head"><h2>Lunch på förskolan</h2></div>
    <p id="menu" style="margin:0;font-size:16px"></p>
  </section>

  <p class="note" id="footer"></p>
</div>

<script>
const SYMBOL={1:"Klart",2:"Nästan klart",3:"Halvklart",4:"Halvklart",5:"Molnigt",6:"Mulet",7:"Dimma",8:"Lätta regnskurar",9:"Regnskurar",10:"Kraftiga regnskurar",11:"Åska",12:"Lätta byar av snöblandat regn",13:"Byar av snöblandat regn",14:"Kraftiga byar av snöblandat regn",15:"Lätta snöbyar",16:"Snöbyar",17:"Kraftiga snöbyar",18:"Lätt regn",19:"Regn",20:"Kraftigt regn",21:"Åska",22:"Lätt snöblandat regn",23:"Snöblandat regn",24:"Kraftigt snöblandat regn",25:"Lätt snöfall",26:"Snöfall",27:"Kraftigt snöfall"};
const $=id=>document.getElementById(id);
const fmt=n=>String(Math.round(n*10)/10).replace(".",",");
const kd=s=>{if(!s)return"";const d=new Date(s+"T12:00");return ["sön","mån","tis","ons","tor","fre","lör"][d.getDay()]+" "+d.getDate()+"/"+(d.getMonth()+1)};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY="forskolemorgon-pw";
const store={get(){try{return localStorage.getItem(KEY)}catch(e){return null}},set(v){try{localStorage.setItem(KEY,v)}catch(e){}},del(){try{localStorage.removeItem(KEY)}catch(e){}}};

// GitHub Pages-adressen användare.github.io/repo -> redigeringslänk till klader.json
(()=>{const m=location.hostname.match(/^([^.]+)\.github\.io$/);const repo=location.pathname.split("/").filter(Boolean)[0];
  $("editLink").href=m&&repo?`https://github.com/${m[1]}/${repo}/edit/main/klader.json`:"https://github.com";})();

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(blob,pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(blob.salt),iterations:blob.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(blob.iv)},key,b64(blob.data));
  return JSON.parse(new TextDecoder().decode(pt));
}

function stats(hours,r){const hs=(hours||[]).filter(h=>h.h>=r[0]&&h.h<=r[1]);if(!hs.length)return null;
  return {min:Math.min(...hs.map(h=>h.t)),max:Math.max(...hs.map(h=>h.t)),p:hs.reduce((a,h)=>a+h.p,0),w:Math.max(...hs.map(h=>h.w)),s:hs.reduce((a,h)=>h.p>a.p?h:a,hs[0]).s}}
const wet=s=>(s>=8&&s<=10)||(s>=12&&s<=14)||(s>=18&&s<=20)||(s>=22&&s<=24);

function render(d){
  $("datum").textContent=d.dag;
  $("barn").textContent=d.barn?.length?"Packar för "+d.barn.join(" och "):"";
  const L=stats(d.timmar,d.lamning),H=stats(d.timmar,d.hamtning),all=[L,H].filter(Boolean);
  let ev=null;
  if(all.length){
    const coldest=Math.min(...all.map(x=>x.min)),warmest=Math.max(...all.map(x=>x.max));
    const rain=all.some(x=>x.p>=0.2||wet(x.s)),wind=Math.max(...all.map(x=>x.w));
    const items=(d.klader||[]).map((k,i)=>{let on=false,why="";
      if(k.regel==="alltid"){on=true;why="alltid"}
      else if(k.regel==="under"){on=coldest<k.varde;why=`under ${k.varde}°`}
      else if(k.regel==="over"){on=warmest>k.varde;why=`över ${k.varde}°`}
      else if(k.regel==="regn"){on=rain;why="regn"}
      else if(k.regel==="blast"){on=wind>k.varde;why=`blåst > ${k.varde} m/s`}
      return {...k,i,on,why}});
    ev={coldest,warmest,rain,items,L};
  }
  // Unikum
  const u=d.unikum||[];
  $("unikum").innerHTML=u.length?u.map(m=>`<div class="msg ${m.typ==="gor"?"gor":""}">
    <div>${m.typ==="gor"?'<span class="pill">Gör</span>':""}<b>${esc(m.rubrik)}</b></div>
    <span>${esc(m.kort)}</span>
    <span class="meta">${esc((m.barn||[]).join(", "))}${m.galler_datum?" · gäller "+kd(m.galler_datum):""} · skickat ${kd(m.skickat)}</span></div>`).join("")
    :'<p class="empty">Inget nytt från förskolan.</p>';
  // Brief
  const gor=u.filter(m=>m.typ==="gor");
  if(ev){
    const head=ev.rain?(ev.L&&ev.L.p>=0.2?"Regn vid lämning":"Regn under dagen"):ev.coldest<0?"Kallt idag":"Uppehåll";
    $("briefHead").textContent=`${head}, ${fmt(ev.coldest)}–${fmt(ev.warmest)}°`;
  } else $("briefHead").textContent="Väder saknas just nu";
  const parts=[];
  const on=ev?ev.items.filter(i=>i.on&&i.regel!=="alltid").map(i=>i.namn.toLowerCase()):[];
  if(on.length)parts.push("Klä på: "+on.join(", ")+".");
  if(gor.length)parts.push("Kom ihåg: "+gor.map(m=>m.kort.replace(/\.$/,"")).join("; ")+".");
  if(d.matsedel)parts.push("Lunch: "+d.matsedel+".");
  $("briefText").textContent=parts.join(" ");
  // Väder
  if(!d.timmar){$("windows").innerHTML="";$("chart").innerHTML='<p class="empty">SMHI svarade inte vid senaste uppdateringen.</p>'}
  else{
    $("vsrc").textContent="SMHI · uppdaterad "+d.hamtad;
    const box=(lbl,r,x)=>x?`<div class="win ${x.p>=0.2?"wet":""}"><span class="lbl">${lbl} ${String(r[0]).padStart(2,"0")}–${String(r[1]).padStart(2,"0")}</span><span class="t">${fmt(x.min)}°</span><span class="d">${SYMBOL[x.s]||""} · ${fmt(x.p)} mm · ${fmt(x.w)} m/s</span></div>`:"";
    $("windows").innerHTML=box("Lämning",d.lamning,L)+box("Hämtning",d.hamtning,H);
    const hs=d.timmar,W=480,Hh=150,pl=28,pr=10,pt=14,pb=24,iw=W-pl-pr,ih=Hh-pt-pb,bw=iw/hs.length;
    const tmin=Math.floor(Math.min(...hs.map(h=>h.t))-1),tmax=Math.ceil(Math.max(...hs.map(h=>h.t))+1),pmax=Math.max(2,...hs.map(h=>h.p));
    const x=i=>pl+bw*i+bw/2,y=t=>pt+ih-(t-tmin)/(tmax-tmin)*ih,yp=v=>v/pmax*ih*.55;
    const inW=h=>(h>=d.lamning[0]&&h<=d.lamning[1])||(h>=d.hamtning[0]&&h<=d.hamtning[1]);
    let s=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Temperatur och nederbörd per timme">`;
    hs.forEach((h,i)=>{if(inW(h.h))s+=`<rect x="${pl+bw*i}" y="${pt}" width="${bw}" height="${ih}" fill="var(--accent)" opacity=".18"/>`});
    [tmin,Math.round((tmin+tmax)/2),tmax].forEach(t=>{s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(t)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${t}°</text>`});
    hs.forEach((h,i)=>{const bh=yp(h.p);if(bh>0)s+=`<rect x="${x(i)-bw*.3}" y="${pt+ih-bh}" width="${bw*.6}" height="${bh}" rx="2" fill="var(--rain)" opacity=".75"/>`;
      if(i%2===0)s+=`<text x="${x(i)}" y="${Hh-8}" font-size="10" text-anchor="middle" fill="var(--muted)">${String(h.h).padStart(2,"0")}</text>`});
    s+=`<polyline fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round" points="${hs.map((h,i)=>x(i)+","+y(h.t)).join(" ")}"/>`;
    s+=`</svg><p class="note" style="margin-top:6px">Linje: temperatur. Staplar: regn (mm/h). Gult: lämning och hämtning.</p>`;
    $("chart").innerHTML=s;
  }
  // Packlista
  const pack=$("pack");
  const onItems=ev?ev.items.filter(i=>i.on):[];
  $("antal").textContent=d.barn?.length?`×${d.barn.length} barn`:"";
  pack.innerHTML=!ev?'<li class="empty">Väntar på väder.</li>':onItems.length?"":'<li class="empty">Inget extra behövs.</li>';
  onItems.forEach(i=>{const li=document.createElement("li");const id="c"+i.i;
    li.innerHTML=`<input type="checkbox" class="chk" id="${id}"><label for="${id}" class="n">${esc(i.namn)}</label><span class="why">${esc(i.why)}</span>`;
    li.querySelector("input").addEventListener("change",e=>li.classList.toggle("done",e.target.checked));pack.appendChild(li)});
  // Matsedel
  $("menu").textContent=d.matsedel||"Matsedeln är inte kopplad än.";
  const fel={vader:"väder",unikum:"Unikum/Gmail",ai:"AI-sammanfattningen",matsedel:"matsedeln"};
  $("footer").textContent=`Uppdaterad ${d.hamtad}.`+(d.fel?.length?" Kunde inte hämta: "+d.fel.map(f=>fel[f]||f).join(", ")+".":"");
}

async function start(){
  let blob;
  try{const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;blob=await r.json()}
  catch(e){document.body.innerHTML='<div class="wrap"><h1>Förskolemorgon</h1><p class="sub">Ingen data än. Kör "Uppdatera morgonskärmen" under Actions i GitHub.</p></div>';return}
  const tryPw=async pw=>{try{render(await decrypt(blob,pw));$("lock").hidden=true;$("app").hidden=false;return true}catch(e){return false}};
  const saved=store.get();
  if(saved&&await tryPw(saved))return;
  store.del();$("lock").hidden=false;$("pw").focus();
  $("lock").addEventListener("submit",async e=>{e.preventDefault();const pw=$("pw").value;
    if(await tryPw(pw)){store.set(pw);$("lockErr").hidden=true}else $("lockErr").hidden=false});
}
start();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!$("app").hidden)start()});
</script>
</body>
</html>
