<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Förskolemorgon">
<meta name="theme-color" content="#F2BE22">
<title>Förskolemorgon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --fg:#1C2730; --muted:#5B6A76; --line:#D5DCE2;
  --accent:#F2BE22; --accent-ink:#2E2300; --rain:#2F6FA8; --rain-soft:#D6E5F2; --warn:#B3261E; --lila:#EFE7FB; --lila-ink:#4A2D7F; --lila-line:#DCCDF4;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#11171C; --surface:#1A232A; --fg:#E6ECF0; --muted:#97A6B2; --line:#2C3943;
  --accent:#F2BE22; --accent-ink:#241B00; --rain:#7DB3E3; --rain-soft:#1F3446; --warn:#F2B8B5; --lila:#2A2140; --lila-ink:#DCCBF7; --lila-line:#3D3060; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:28px;line-height:1.1}
h2{font-size:17px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sub{color:var(--muted);font-size:14px;margin:0}
.brief{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:8px}
.brief p{margin:0;font-size:18px;line-height:1.35;font-weight:500}
.brief p.lead{font-family:var(--display);font-size:23px;font-weight:700;line-height:1.2}
.brief p.tank{font-weight:600}
.brief .datum{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:14px;font-weight:600;letter-spacing:.02em;border-bottom:1px solid rgba(0,0,0,.14);padding-bottom:8px;margin-bottom:2px}
.brief .datum .dn{font-family:var(--display);font-size:17px;font-weight:700}
.brief .datum .nd{font-weight:500;opacity:.85}
.namnsdag{background:var(--lila);color:var(--lila-ink);border:1px solid var(--lila-line);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:15px}
.namnsdag b{font-weight:600}
.namnsdag .nar{font-size:13px;opacity:.85}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.src{font-size:12px;color:var(--muted)}
.windows{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.win{border-radius:10px;background:var(--bg);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.win .lbl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.win .t{font-family:var(--display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.win .d{font-size:13px;color:var(--muted)}
.win.wet{background:var(--rain-soft)}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:320px;height:auto}
.msgs{display:flex;flex-direction:column;gap:12px}
.msg{border-left:3px solid var(--line);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:2px}
.msg.gor{border-left-color:var(--rain)}
.msg .meta{font-size:12px;color:var(--muted)}
.msg b{font-weight:600}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:1px 7px;margin-right:6px;background:var(--rain-soft);color:var(--rain)}
.empty,.note{color:var(--muted);font-size:14px;margin:0}
.err{color:var(--warn);font-size:13px;margin:0}
.lock{max-width:360px;margin:12vh auto 0;display:flex;flex-direction:column;gap:12px}
.lock input{font:inherit;font-size:17px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.lock button{font:inherit;font-weight:600;font-size:16px;padding:12px;border-radius:10px;border:0;background:var(--fg);color:var(--bg);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>

<form class="lock" id="lock" hidden>
  <h1>Förskolemorgon</h1>
  <p class="sub">Skriv lösenordet för att låsa upp. Det sparas på den här telefonen.</p>
  <input type="password" id="pw" autocomplete="current-password" aria-label="Lösenord" required>
  <button type="submit">Lås upp</button>
  <p class="err" id="lockErr" hidden>Fel lösenord. Försök igen.</p>
</form>

<div class="wrap" id="app" hidden>
  <header><h1>Förskolemorgon</h1></header>

  <div class="brief" id="brief" aria-live="polite"></div>

  <section class="card">
    <div class="head"><h2>Från Unikum</h2><span class="src">senaste veckan</span></div>
    <div class="msgs" id="unikum"></div>
  </section>

  <div class="namnsdag" id="namnsdag" hidden></div>

  <section class="card">
    <div class="head"><h2>Väder vid förskolan</h2><span class="src" id="vsrc">SMHI</span></div>
    <div class="windows" id="windows"></div>
    <div class="chart" id="chart"></div>
    <p class="note" id="klader" hidden></p>
  </section>

  <p class="note" id="footer"></p>
</div>

<script>
const PRECIP={8:"lätta regnskurar",9:"regnskurar",10:"kraftiga regnskurar",11:"åska",12:"byar av snöblandat regn",13:"byar av snöblandat regn",14:"kraftiga byar av snöblandat regn",15:"lätta snöbyar",16:"snöbyar",17:"kraftiga snöbyar",18:"lätt regn",19:"regn",20:"kraftigt regn",21:"åska",22:"lätt snöblandat regn",23:"snöblandat regn",24:"kraftigt snöblandat regn",25:"lätt snöfall",26:"snöfall",27:"kraftigt snöfall"};
const SKY={1:"sol",2:"mest sol",3:"växlande molnighet",4:"växlande molnighet",5:"molnigt",6:"mulet",7:"dimma"};
const RIKTNING=["nord","nordost","ost","sydost","syd","sydväst","väst","nordväst"];
const $=id=>document.getElementById(id);
const fmt=n=>String(Math.round(n*10)/10).replace(".",",").replace("-","−");
const heltal=n=>{const r=Math.round(n);return (r<0?"−":"")+Math.abs(r)};
const grader=n=>`${heltal(n)}°`;
const MAN=["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
const DAG=["Söndag","Måndag","Tisdag","Onsdag","Torsdag","Fredag","Lördag"];
const kortDatum=iso=>{const d=new Date(iso+"T12:00");return `${DAG[d.getDay()]} ${d.getDate()} ${MAN[d.getMonth()]}`};
const dagarTill=(fran,till)=>Math.round((new Date(till+"T12:00")-new Date(fran+"T12:00"))/864e5);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kd=s=>{if(!s)return"";const d=new Date(s+"T12:00");return ["sön","mån","tis","ons","tor","fre","lör"][d.getDay()]+" "+d.getDate()+"/"+(d.getMonth()+1)};
const KEY="forskolemorgon-pw";
const store={get(){try{return localStorage.getItem(KEY)}catch(e){return null}},set(v){try{localStorage.setItem(KEY,v)}catch(e){}},del(){try{localStorage.removeItem(KEY)}catch(e){}}};

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(blob,pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(blob.salt),iterations:blob.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(blob.iv)},key,b64(blob.data));
  return JSON.parse(new TextDecoder().decode(pt));
}

function inWin(hours,r){let hs=(hours||[]).filter(h=>h.h>=r[0]&&h.h<=r[1]);
  if(!hs.length&&hours?.length){const mid=(r[0]+r[1])/2;hs=[hours.reduce((a,h)=>Math.abs(h.h-mid)<Math.abs(a.h-mid)?h:a)]}
  return hs}
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const isWet=h=>h.p>=0.2||PRECIP[h.s];

// Vädret under förskoledagen beskrivet med ett par ord
function dagBeskrivning(hours){
  const dag=hours.filter(h=>h.h>=7&&h.h<=17);
  if(!dag.length)return "";
  const vata=dag.filter(isWet);
  if(vata.length){
    const v=vata.reduce((a,h)=>h.p>a.p?h:a,vata[0]);
    const ord=PRECIP[v.s]||(v.t<=0?"lite snö":"lite regn");
    if(vata.length>=dag.length-2)return ord;
    if(vata.every(h=>h.h<12))return ord+" på förmiddagen";
    if(vata.every(h=>h.h>=12))return ord+" på eftermiddagen";
    return ord+" ibland";
  }
  const n={};dag.filter(h=>h.h>=8&&h.h<=16).forEach(h=>{const k=SKY[h.s]||"molnigt";n[k]=(n[k]||0)+1});
  return Object.entries(n).sort((a,b)=>b[1]-a[1])[0]?.[0]||"uppehåll";
}

function vader(d){
  const hs=d.timmar;if(!hs?.length)return null;
  const L=inWin(hs,d.lamning),H=inWin(hs,d.hamtning),both=[...L,...H];
  const tL=avg(L.map(h=>h.t)),tH=avg(H.map(h=>h.t));
  const blas=both.reduce((a,h)=>h.w>a.w?h:a,both[0]);
  const besk=dagBeskrivning(hs);
  const skiljer=Math.abs(Math.round(tL)-Math.round(tH))>=2;
  const temp=`${grader(skiljer?tL:(tL+tH)/2)} och ${besk}`;
  const hamt=skiljer?`${grader(tH)} vid hämtning.`:null;
  let vind;
  if(blas.w<2)vind="Nästan vindstilla.";
  else{vind=`Vind ${Math.round(blas.w)}\u00a0m/s`+(blas.d!=null?` från ${RIKTNING[Math.round(blas.d/45)%8]}`:"");
    if(blas.g&&blas.g>=blas.w+5&&blas.g>=10)vind+=`, i byarna ${Math.round(blas.g)}\u00a0m/s`;vind+="."}
  const snow=both.some(h=>(h.s>=12&&h.s<=17)||h.s>=22||(isWet(h)&&h.t<=0)),rain=both.some(isWet);
  const kall=Math.min(...both.map(h=>h.t));
  const tips=[];
  if(snow)tips.push("vattentäta vinterskor");else if(rain)tips.push("regnkläder och gummistövlar");
  if(kall<0)tips.push("vinteroverall");
  if(kall<6)tips.push("mössa och vantar");
  return {L,H,tL,tH,temp,hamt,vind,tips};
}

function lunch(t){
  if(!t)return null;
  let s=t.replace(/\s+serveras\s+(med\s+)?/gi," med ").replace(/\s+/g," ").trim().replace(/[.\s]+$/,"");
  return s.charAt(0).toLowerCase()+s.slice(1);
}

function render(d){
  const v=vader(d);
  const u=d.unikum||[];
  // Sammanfattningen
  const rader=[];
  if(v){rader.push({c:"lead",t:`${v.temp}.`});
    if(v.hamt)rader.push({t:v.hamt});rader.push({t:v.vind})}
  else rader.push({c:"lead",t:"Vädret saknas just nu."});
  const l=lunch(d.matsedel);
  if(l)rader.push({t:`Barnen får ${l} till lunch.`});
  u.filter(m=>m.typ==="gor").forEach(m=>rader.push({c:"tank",t:"Tänk på: "+m.kort.replace(/\.$/,"")+"."}));
  const info=u.filter(m=>m.typ!=="gor");
  if(info.length)rader.push({t:"Från Unikum: "+info.map(m=>m.rubrik).join(", ")+"."});
  const bev=d.bevakade_namnsdagar||[];
  const idagNamn=bev.filter(n=>n.datum===d.datum).map(n=>n.namn);
  if(idagNamn.length)rader.push({c:"tank",t:`${idagNamn.join(" och ")} har namnsdag!`});
  $("brief").innerHTML=`<div class="datum"><span class="dn">${esc(kortDatum(d.datum))}</span></div>`+
    rader.map(r=>`<p${r.c?` class="${r.c}"`:""}>${esc(r.t)}</p>`).join("");
  // Lila ruta: nästa bevakade namnsdag (efter idag)
  const nasta=bev.filter(n=>n.datum>d.datum);
  const box=$("namnsdag");
  if(!nasta.length){box.hidden=true}
  else{const f=nasta[0].datum,samma=nasta.filter(n=>n.datum===f).map(n=>n.namn),om=dagarTill(d.datum,f);
    box.hidden=false;
    box.innerHTML=`<span>Nästa namnsdag: <b>${esc(samma.join(" och "))}</b></span><span class="nar">${esc(kortDatum(f))} · ${om===1?"om 1 dag":"om "+om+" dagar"}</span>`}
  // Unikum
  $("unikum").innerHTML=u.length?u.map(m=>`<div class="msg ${m.typ==="gor"?"gor":""}">
    <div>${m.typ==="gor"?'<span class="pill">Tänk på</span>':""}<b>${esc(m.rubrik)}</b></div>
    <span>${esc(m.kort)}</span>
    <span class="meta">${esc((m.barn||[]).join(", "))}${m.galler_datum?" · gäller "+kd(m.galler_datum):""} · skickat ${kd(m.skickat)}</span></div>`).join("")
    :'<p class="empty">Inget nytt från förskolan.</p>';
  // Väder
  if(!v){$("windows").innerHTML="";$("chart").innerHTML='<p class="empty">SMHI svarade inte vid senaste uppdateringen.</p>';$("klader").hidden=true}
  else{
    $("vsrc").textContent="SMHI · uppdaterad "+d.hamtad;
    const box=(lbl,r,hs,t)=>{const p=hs.reduce((a,h)=>a+h.p,0),w=Math.max(...hs.map(h=>h.w)),s=hs.reduce((a,h)=>h.p>a.p?h:a,hs[0]).s;
      return `<div class="win ${p>=0.2?"wet":""}"><span class="lbl">${lbl} ${String(r[0]).padStart(2,"0")}–${String(r[1]).padStart(2,"0")}</span><span class="t">${fmt(t)}°</span><span class="d">${PRECIP[s]||SKY[s]||""} · ${fmt(w)} m/s</span></div>`};
    $("windows").innerHTML=box("Lämning",d.lamning,v.L,v.tL)+box("Hämtning",d.hamtning,v.H,v.tH);
    const hs=d.timmar,W=480,Hh=150,pl=28,pr=10,pt=14,pb=24,iw=W-pl-pr,ih=Hh-pt-pb,bw=iw/hs.length;
    const tmin=Math.floor(Math.min(...hs.map(h=>h.t))-1),tmax=Math.ceil(Math.max(...hs.map(h=>h.t))+1),pmax=Math.max(2,...hs.map(h=>h.p));
    const x=i=>pl+bw*i+bw/2,y=t=>pt+ih-(t-tmin)/(tmax-tmin)*ih,yp=q=>q/pmax*ih*.55;
    const iw2=h=>(h>=d.lamning[0]&&h<=d.lamning[1])||(h>=d.hamtning[0]&&h<=d.hamtning[1]);
    let s=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Temperatur och nederbörd per timme">`;
    hs.forEach((h,i)=>{if(iw2(h.h))s+=`<rect x="${pl+bw*i}" y="${pt}" width="${bw}" height="${ih}" fill="var(--accent)" opacity=".18"/>`});
    [tmin,Math.round((tmin+tmax)/2),tmax].forEach(t=>{s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(t)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${t}°</text>`});
    hs.forEach((h,i)=>{const bh=yp(h.p);if(bh>0)s+=`<rect x="${x(i)-bw*.3}" y="${pt+ih-bh}" width="${bw*.6}" height="${bh}" rx="2" fill="var(--rain)" opacity=".75"/>`;
      if(i%2===0)s+=`<text x="${x(i)}" y="${Hh-8}" font-size="10" text-anchor="middle" fill="var(--muted)">${String(h.h).padStart(2,"0")}</text>`});
    s+=`<polyline fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round" points="${hs.map((h,i)=>x(i)+","+y(h.t)).join(" ")}"/>`;
    s+=`</svg><p class="note" style="margin-top:6px">Linje: temperatur. Staplar: regn (mm/h). Gult: lämning och hämtning.</p>`;
    $("chart").innerHTML=s;
    $("klader").hidden=!v.tips.length;
    if(v.tips.length)$("klader").textContent="Klädtips: "+v.tips.join(", ")+".";
  }
  const fel={vader:"väder",unikum:"Unikum/Gmail",ai:"AI-sammanfattningen",matsedel:"matsedeln"};
  $("footer").textContent=`Uppdaterad ${d.hamtad}.`+(d.matsedel?"":" Ingen lunchmeny för dagen – mejla en ny meny-PDF.")+(d.fel?.length?" Kunde inte hämta: "+d.fel.map(f=>fel[f]||f).join(", ")+".":"");
}

async function start(){
  let blob;
  try{const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;blob=await r.json()}
  catch(e){document.body.innerHTML='<div class="wrap"><h1>Förskolemorgon</h1><p class="sub">Ingen data än. Kör "Uppdatera morgonskärmen" under Actions i GitHub.</p></div>';return}
  const tryPw=async pw=>{let d;try{d=await decrypt(blob,pw)}catch(e){return false}
    render(d);$("lock").hidden=true;$("app").hidden=false;return true};
  const saved=store.get();
  if(saved&&await tryPw(saved))return;
  store.del();$("lock").hidden=false;$("pw").focus();
  $("lock").onsubmit=async e=>{e.preventDefault();const pw=$("pw").value;
    if(await tryPw(pw)){store.set(pw);$("lockErr").hidden=true}else $("lockErr").hidden=false};
}
start();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!$("app").hidden)start()});
</script>
</body>
</html>
